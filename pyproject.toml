[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tourdeparole"
version = "0.1.0"
description = "Speaker-attributed meeting transcription evaluated on the AMI Meeting Corpus"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    "jiwer==4.0.0",
    "pyannote.audio==4.0.7",
    "pyannote.core==6.1.0",
    "pyannote.database==6.1.1",
    "pyannote.metrics==4.2.0",
    "soundfile==0.14.0",
    "torch>=2.8",
    "whisper-normalizer==0.1.15",
]

[tool.setuptools.packages.find]
where = ["src"]
